<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高度角與仰角互動學習教室</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
        }
        .canvas-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
        .target-pill {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .target-pill.active {
            background-color: #0d9488;
            color: #ffffff;
            box-shadow: 0 4px 12px -2px rgba(13, 148, 136, 0.6);
            border-color: #14b8a6;
        }
        input[type=range] {
            accent-color: #0d9488;
        }
        .compass-glow {
            filter: drop-shadow(0px 0px 8px rgba(56, 189, 248, 0.7));
        }
    </style>
</head>
<body class="min-h-screen bg-slate-900 flex flex-col text-slate-100">

    <header class="bg-slate-800/95 border-b border-slate-700/80 text-white shadow-md sticky top-0 z-30 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
            
            <!-- Mode Switcher -->
            <div class="flex items-center space-x-1 bg-slate-900/80 p-1 rounded-2xl border border-slate-700/80">
                <button id="btn-mode-explore" onclick="setMode('explore')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition bg-teal-600 text-white shadow">
                    <i class="fa-solid fa-compass mr-1"></i> 自由探索
                </button>
                <button id="btn-mode-dual" onclick="setMode('dual')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition text-slate-300 hover:text-white">
                    <i class="fa-solid fa-users-viewfinder mr-1"></i> 雙點測高 (對照組)
                </button>
            </div>

            <!-- Target Selection Pill Menu -->
            <div class="flex items-center space-x-1 sm:space-x-1.5 overflow-x-auto py-1 px-2 bg-slate-900/80 rounded-2xl border border-slate-700/80">
                <span class="text-xs font-bold text-slate-400 pl-1 pr-1 hidden sm:inline">選擇目標:</span>
                
                <button onclick="selectTarget('balloon')" id="target-balloon" class="target-pill active px-2.5 py-1.5 rounded-xl border border-transparent font-bold text-xs flex items-center space-x-1 whitespace-nowrap">
                    <span>🎈</span>
                    <span>熱氣球</span>
                </button>
                <button onclick="selectTarget('kite')" id="target-kite" class="target-pill px-2.5 py-1.5 rounded-xl border border-transparent text-slate-300 hover:bg-slate-800 font-bold text-xs flex items-center space-x-1 whitespace-nowrap">
                    <span>🪁</span>
                    <span>風箏</span>
                </button>
                <button onclick="selectTarget('drone')" id="target-drone" class="target-pill px-2.5 py-1.5 rounded-xl border border-transparent text-slate-300 hover:bg-slate-800 font-bold text-xs flex items-center space-x-1 whitespace-nowrap">
                    <span>🚁</span>
                    <span>無人機</span>
                </button>
                <button onclick="selectTarget('tree')" id="target-tree" class="target-pill px-2.5 py-1.5 rounded-xl border border-transparent text-slate-300 hover:bg-slate-800 font-bold text-xs flex items-center space-x-1 whitespace-nowrap">
                    <span>🌴</span>
                    <span>椰子樹</span>
                </button>
                <button onclick="selectTarget('moon')" id="target-moon" class="target-pill px-2.5 py-1.5 rounded-xl border border-transparent text-slate-300 hover:bg-slate-800 font-bold text-xs flex items-center space-x-1 whitespace-nowrap">
                    <span>🌙</span>
                    <span>月亮 (夜景)</span>
                </button>
                <button onclick="selectTarget('lamp')" id="target-lamp" class="target-pill px-2.5 py-1.5 rounded-xl border border-transparent text-slate-300 hover:bg-slate-800 font-bold text-xs flex items-center space-x-1 whitespace-nowrap">
                    <span>💡</span>
                    <span>路燈 (夜景)</span>
                </button>
            </div>

        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 flex flex-col justify-center space-y-3">

        <!-- Canvas Viewport -->
        <div class="relative w-full bg-slate-800 rounded-2xl border border-slate-700/80 canvas-shadow overflow-hidden">

            <!-- BOTTOM-RIGHT: 8-Point Map Compass Rose (八方位盤) -->
            <div class="absolute bottom-3 right-3 z-10 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-2xl p-2.5 shadow-2xl flex flex-col items-center">
                <span class="text-[10px] font-black text-sky-300 mb-1 tracking-wider uppercase">地圖八方位盤</span>
                
                <div class="relative w-28 h-28 flex items-center justify-center">
                    <svg id="compass-rose-svg" viewBox="0 0 200 200" class="w-full h-full compass-glow">
                        <circle cx="100" cy="100" r="72" fill="none" stroke="#0284c7" stroke-width="2.5" />
                        <circle cx="100" cy="100" r="68" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />

                        <!-- 8 Compass Points -->
                        <polygon points="100,100 100,28 112,88" fill="#0284c7" />
                        <polygon points="100,100 100,28 88,88" fill="#38bdf8" />
                        <polygon points="100,100 100,172 88,112" fill="#0284c7" />
                        <polygon points="100,100 100,172 112,112" fill="#38bdf8" />
                        <polygon points="100,100 172,100 112,112" fill="#0284c7" />
                        <polygon points="100,100 172,100 112,88" fill="#38bdf8" />
                        <polygon points="100,100 28,100 88,88" fill="#0284c7" />
                        <polygon points="100,100 28,100 88,112" fill="#38bdf8" />

                        <polygon points="100,100 150,50 114,86" fill="#7e22ce" />
                        <polygon points="100,100 150,50 136,64" fill="#a855f7" />
                        <polygon points="100,100 150,150 136,136" fill="#7e22ce" />
                        <polygon points="100,100 150,150 114,114" fill="#a855f7" />
                        <polygon points="100,100 50,150 86,114" fill="#7e22ce" />
                        <polygon points="100,100 50,150 64,136" fill="#a855f7" />
                        <polygon points="100,100 50,50 64,64" fill="#7e22ce" />
                        <polygon points="100,100 50,50 86,86" fill="#a855f7" />

                        <circle cx="100" cy="100" r="7" fill="#facc15" stroke="#ffffff" stroke-width="2" />

                        <text x="100" y="18" fill="#38bdf8" font-size="15" font-weight="900" text-anchor="middle">北</text>
                        <text x="174" y="52" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">東北</text>
                        <text x="188" y="105" fill="#38bdf8" font-size="15" font-weight="900" text-anchor="middle">東</text>
                        <text x="174" y="160" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">東南</text>
                        <text x="100" y="194" fill="#38bdf8" font-size="15" font-weight="900" text-anchor="middle">南</text>
                        <text x="26" y="160" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">西南</text>
                        <text x="12" y="105" fill="#38bdf8" font-size="15" font-weight="900" text-anchor="middle">西</text>
                        <text x="26" y="52" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">西北</text>
                    </svg>

                    <!-- Pointer Needle -->
                    <div id="compass-pointer" class="absolute w-1 h-20 origin-center transition-transform duration-200 pointer-events-none flex flex-col justify-between items-center">
                        <div class="w-3 h-3 bg-amber-400 rounded-full shadow-lg border-2 border-white"></div>
                        <div class="w-1 h-full bg-gradient-to-b from-amber-400 to-transparent"></div>
                    </div>
                </div>

                <div class="mt-1 text-center">
                    <span id="compass-direction-text" class="text-xs font-black text-amber-300">相對方位: 東 (East)</span>
                </div>
            </div>

            <!-- HTML5 Interactive Canvas -->
            <canvas id="simCanvas" class="w-full h-[480px] sm:h-[540px] block cursor-grab touch-none"></canvas>

            <!-- Bottom Instruction Badge -->
            <div class="absolute bottom-3 left-3 z-10 bg-slate-900/80 backdrop-blur-md text-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-semibold shadow-lg flex items-center space-x-2 border border-slate-700">
                <i class="fa-solid fa-arrows-left-right text-amber-400 animate-pulse"></i>
                <span>手指/滑鼠可左右拖曳「主角」與自由移動「目標物」</span>
            </div>
        </div>

        <!-- Bottom Controls Bar -->
        <div class="bg-slate-800 rounded-2xl border border-slate-700/80 p-3 shadow-md flex flex-col sm:flex-row items-center justify-between gap-3">
            
            <!-- Quick Movement Controls -->
            <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
                <span class="text-xs font-bold text-slate-300 whitespace-nowrap">快捷移動男學生:</span>
                <div class="flex items-center space-x-2">
                    <button onclick="stepStudent(-0.5)" class="w-9 h-9 rounded-xl bg-teal-600 hover:bg-teal-500 active:scale-95 text-white font-black flex items-center justify-center transition shadow">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <button onclick="stepStudent(0.5)" class="w-9 h-9 rounded-xl bg-teal-600 hover:bg-teal-500 active:scale-95 text-white font-black flex items-center justify-center transition shadow">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
                <span class="text-xs text-slate-400 hidden lg:inline">(可使用方向鍵 ⬅️ ➡️ / A D)</span>
            </div>

            <!-- Scale & Reset Controls -->
            <div class="flex items-center justify-end space-x-4 w-full sm:w-auto">
                <div class="flex items-center space-x-2">
                    <span class="text-xs font-bold text-slate-300 whitespace-nowrap">視野縮放:</span>
                    <input id="scaleSlider" type="range" min="18" max="36" value="26" oninput="onScaleChange(this.value)" class="w-24 sm:w-28 h-2 bg-slate-700 rounded-lg cursor-pointer">
                </div>

                <button onclick="resetScene()" class="px-3.5 py-2 bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 rounded-xl text-xs font-bold border border-slate-600 transition flex items-center space-x-1.5 shadow">
                    <i class="fa-solid fa-rotate-right text-teal-400"></i>
                    <span>重置位置</span>
                </button>
            </div>

        </div>

    </main>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const state = {
            mode: 'explore', // 'explore' or 'dual'
            targetType: 'balloon', // 'balloon', 'kite', 'drone', 'tree', 'moon', 'lamp'
            pixelsPerMeter: 26,
            isNight: false,

            // Primary student (Boy) - locked on ground (y: 0.0)
            studentA: {
                x: 6.0,
                y: 0.0,
                isFemale: false
            },

            // Secondary student (Girl) - locked on ground (y: 0.0)
            studentB: {
                x: 14.0,
                y: 0.0,
                isFemale: true
            },

            // Target object position in world space
            target: {
                x: 22.0,
                y: 9.5
            },

            stars: [],
            activeDrag: null // 'studentA', 'studentB', 'target'
        };

        function generateStars() {
            state.stars = [];
            const colors = ['#ffffff', '#fef08a', '#bae6fd', '#e9d5ff'];
            for (let i = 0; i < 140; i++) {
                state.stars.push({
                    x: Math.random(),
                    y: Math.random() * 0.85,
                    r: Math.random() * 1.6 + 0.4,
                    alpha: Math.random() * 0.75 + 0.25,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }
        generateStars();

        function resizeCanvas() {
            const container = canvas.parentElement;
            const cssW = container.clientWidth;
            const cssH = container.clientHeight;
            const dpr = window.devicePixelRatio || 1;

            canvas.width = cssW * dpr;
            canvas.height = cssH * dpr;
            canvas.style.width = `${cssW}px`;
            canvas.style.height = `${cssH}px`;

            ctx.scale(dpr, dpr);
            render();
        }

        window.addEventListener('resize', resizeCanvas);

        function worldToScreen(wx, wy) {
            const cssH = canvas.clientHeight;
            const groundY = cssH - 65;

            const sx = wx * state.pixelsPerMeter;
            const sy = groundY - (wy * state.pixelsPerMeter);
            return { x: sx, y: sy };
        }

        function screenToWorld(sx, sy) {
            const cssH = canvas.clientHeight;
            const groundY = cssH - 65;

            const wx = sx / state.pixelsPerMeter;
            const wy = (groundY - sy) / state.pixelsPerMeter;
            return { x: wx, y: wy };
        }

        function setMode(mode) {
            state.mode = mode;
            document.getElementById('btn-mode-explore').className = (mode === 'explore') 
                ? "px-3.5 py-1.5 rounded-xl text-xs font-bold transition bg-teal-600 text-white shadow"
                : "px-3.5 py-1.5 rounded-xl text-xs font-bold transition text-slate-300 hover:text-white";
            
            document.getElementById('btn-mode-dual').className = (mode === 'dual')
                ? "px-3.5 py-1.5 rounded-xl text-xs font-bold transition bg-teal-600 text-white shadow"
                : "px-3.5 py-1.5 rounded-xl text-xs font-bold transition text-slate-300 hover:text-white";
            
            render();
        }

        function selectTarget(type) {
            state.targetType = type;
            state.isNight = (type === 'moon' || type === 'lamp');

            document.querySelectorAll('.target-pill').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.add('text-slate-300');
            });

            const activeBtn = document.getElementById(`target-${type}`);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('text-slate-300');
            }

            render();
        }

        function onScaleChange(val) {
            state.pixelsPerMeter = parseFloat(val);
            render();
        }

        function stepStudent(delta) {
            state.studentA.x = Math.max(0.5, state.studentA.x + delta);
            state.studentA.y = 0.0; // Fixed on ground
            render();
        }

        function resetScene() {
            state.studentA.x = 6.0;
            state.studentA.y = 0.0; // Fixed on ground
            state.studentB.x = 14.0;
            state.studentB.y = 0.0; // Fixed on ground
            state.target.x = 22.0;
            state.target.y = 9.5;
            render();
        }

        function drawBackground() {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            const groundY = h - 65;

            if (state.isNight) {
                // ==================== ENHANCED NIGHT ENVIRONMENT ====================
                // Deep Cosmic Sky Gradient
                const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
                skyGrad.addColorStop(0, '#030712');
                skyGrad.addColorStop(0.35, '#0f172a');
                skyGrad.addColorStop(0.7, '#1e1b4b');
                skyGrad.addColorStop(1, '#2e1065');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, w, groundY);

                // Cosmic Nebulae Soft Glows
                const nebula1 = ctx.createRadialGradient(w * 0.25, groundY * 0.35, 10, w * 0.25, groundY * 0.35, 200);
                nebula1.addColorStop(0, 'rgba(147, 51, 234, 0.18)');
                nebula1.addColorStop(1, 'transparent');
                ctx.fillStyle = nebula1;
                ctx.fillRect(0, 0, w, groundY);

                const nebula2 = ctx.createRadialGradient(w * 0.75, groundY * 0.5, 10, w * 0.75, groundY * 0.5, 240);
                nebula2.addColorStop(0, 'rgba(56, 189, 248, 0.14)');
                nebula2.addColorStop(1, 'transparent');
                ctx.fillStyle = nebula2;
                ctx.fillRect(0, 0, w, groundY);

                // Stars with Lens Flares for Bright Stars
                state.stars.forEach(s => {
                    ctx.save();
                    ctx.globalAlpha = s.alpha;
                    ctx.fillStyle = s.color || '#ffffff';
                    ctx.beginPath();
                    ctx.arc(s.x * w, s.y * groundY, s.r, 0, Math.PI * 2);
                    ctx.fill();

                    if (s.r > 1.4) {
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(s.x * w - s.r * 2.5, s.y * groundY);
                        ctx.lineTo(s.x * w + s.r * 2.5, s.y * groundY);
                        ctx.moveTo(s.x * w, s.y * groundY - s.r * 2.5);
                        ctx.lineTo(s.x * w, s.y * groundY + s.r * 2.5);
                        ctx.stroke();
                    }
                    ctx.restore();
                });

                // Night Mountain Silhouettes - Far Layer
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(0, groundY - 80);
                ctx.bezierCurveTo(w * 0.18, groundY - 140, w * 0.28, groundY - 60, w * 0.42, groundY - 110);
                ctx.bezierCurveTo(w * 0.58, groundY - 150, w * 0.72, groundY - 70, w * 0.88, groundY - 125);
                ctx.bezierCurveTo(w * 0.96, groundY - 140, w, groundY - 95, w, groundY);
                ctx.closePath();
                ctx.fill();

                // Mountain Edge Moonlight Rim Highlight
                ctx.strokeStyle = 'rgba(129, 140, 248, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Near Hill Silhouette
                ctx.fillStyle = '#022c22';
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.quadraticCurveTo(w * 0.25, groundY - 50, w * 0.5, groundY - 20);
                ctx.quadraticCurveTo(w * 0.75, groundY - 60, w, groundY - 25);
                ctx.lineTo(w, groundY);
                ctx.closePath();
                ctx.fill();

                // Rich Night Ground Gradient
                const darkGrass = ctx.createLinearGradient(0, groundY, 0, h);
                darkGrass.addColorStop(0, '#064e3b');
                darkGrass.addColorStop(0.4, '#022c22');
                darkGrass.addColorStop(1, '#020617');
                ctx.fillStyle = darkGrass;
                ctx.fillRect(0, groundY, w, h - groundY);

                // Horizon Highlight Rim Line
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke();

            } else {
                // ==================== ENHANCED DAY ENVIRONMENT ====================
                // Atmospheric Sky Gradient
                const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
                skyGrad.addColorStop(0, '#0284c7');
                skyGrad.addColorStop(0.35, '#38bdf8');
                skyGrad.addColorStop(0.7, '#7dd3fc');
                skyGrad.addColorStop(1, '#e0f2fe');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, w, groundY);

                // Vibrant Sun with Radial Rays
                const sunX = w - 90;
                const sunY = 70;

                ctx.save();
                ctx.fillStyle = 'rgba(254, 240, 138, 0.12)';
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
                    ctx.beginPath();
                    ctx.moveTo(sunX, sunY);
                    ctx.arc(sunX, sunY, 320, a - 0.1, a + 0.1);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();

                // Outer Sun Aura
                const sunGlow = ctx.createRadialGradient(sunX, sunY, 15, sunX, sunY, 70);
                sunGlow.addColorStop(0, 'rgba(254, 240, 138, 0.9)');
                sunGlow.addColorStop(0.4, 'rgba(253, 224, 71, 0.35)');
                sunGlow.addColorStop(1, 'transparent');
                ctx.fillStyle = sunGlow;
                ctx.beginPath(); ctx.arc(sunX, sunY, 70, 0, Math.PI * 2); ctx.fill();

                // Inner Sun Core
                const sunCore = ctx.createRadialGradient(sunX - 5, sunY - 5, 2, sunX, sunY, 26);
                sunCore.addColorStop(0, '#ffffff');
                sunCore.addColorStop(0.3, '#fef08a');
                sunCore.addColorStop(1, '#f59e0b');
                ctx.fillStyle = sunCore;
                ctx.beginPath(); ctx.arc(sunX, sunY, 26, 0, Math.PI * 2); ctx.fill();

                // Mountain Ranges (3 Depth Layers)
                // Layer 1: Distant Misty Purple/Blue Mountains
                ctx.fillStyle = '#93c5fd';
                ctx.globalAlpha = 0.55;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(0, groundY - 90);
                ctx.lineTo(w * 0.12, groundY - 150);
                ctx.lineTo(w * 0.28, groundY - 75);
                ctx.lineTo(w * 0.45, groundY - 170);
                ctx.lineTo(w * 0.62, groundY - 80);
                ctx.lineTo(w * 0.8, groundY - 145);
                ctx.lineTo(w, groundY - 95);
                ctx.lineTo(w, groundY);
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = 1.0;

                // Layer 2: Midground Rolling Hills
                ctx.fillStyle = '#86efac';
                ctx.globalAlpha = 0.75;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.bezierCurveTo(w * 0.15, groundY - 85, w * 0.3, groundY - 40, w * 0.5, groundY - 75);
                ctx.bezierCurveTo(w * 0.7, groundY - 110, w * 0.85, groundY - 35, w, groundY - 60);
                ctx.lineTo(w, groundY);
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = 1.0;

                // Layer 3: Foreground Gentle Green Ridge
                ctx.fillStyle = '#4ade80';
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.quadraticCurveTo(w * 0.35, groundY - 35, w * 0.75, groundY - 15);
                ctx.quadraticCurveTo(w * 0.9, groundY - 5, w, groundY - 20);
                ctx.lineTo(w, groundY);
                ctx.closePath();
                ctx.fill();

                // Realistic Clouds with Soft Shadows
                drawCloud(w * 0.1, 55, 0.9);
                drawCloud(w * 0.42, 45, 1.15);
                drawCloud(w * 0.75, 75, 0.75);

                // Detailed Lawn Ground
                const grassGrad = ctx.createLinearGradient(0, groundY, 0, h);
                grassGrad.addColorStop(0, '#22c55e');
                grassGrad.addColorStop(0.3, '#16a34a');
                grassGrad.addColorStop(1, '#15803d');
                ctx.fillStyle = grassGrad;
                ctx.fillRect(0, groundY, w, h - groundY);

                // Lawn Top Highlight Rim Line
                ctx.strokeStyle = '#86efac';
                ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke();
            }
        }

        function drawCloud(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Cloud Shadow
            ctx.fillStyle = 'rgba(186, 230, 253, 0.4)';
            ctx.beginPath();
            ctx.arc(2, 4, 22, Math.PI * 0.5, Math.PI * 1.5);
            ctx.arc(24, -8, 24, Math.PI * 1.0, Math.PI * 1.85);
            ctx.arc(52, -4, 20, Math.PI * 1.5, Math.PI * 2.0);
            ctx.arc(64, 4, 18, Math.PI * 1.8, Math.PI * 0.5);
            ctx.closePath();
            ctx.fill();

            // Cloud Main Body
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.arc(0, 0, 20, Math.PI * 0.5, Math.PI * 1.5);
            ctx.arc(22, -12, 22, Math.PI * 1.0, Math.PI * 1.85);
            ctx.arc(50, -8, 18, Math.PI * 1.5, Math.PI * 2.0);
            ctx.arc(62, 0, 16, Math.PI * 1.8, Math.PI * 0.5);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawWaistCompass(screenX, waistY) {
            ctx.save();
            ctx.translate(screenX, waistY);

            const rx = 32;
            const ry = 11;

            // Ring Base
            ctx.fillStyle = state.isNight ? 'rgba(15, 23, 42, 0.88)' : 'rgba(255, 255, 255, 0.9)';
            ctx.strokeStyle = state.isNight ? '#38bdf8' : '#0284c7';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 4 Cardinal Direction Badges
            const compassDirs = [
                { text: '東', px: rx - 2, py: 0 },
                { text: '南', px: 0, py: ry - 1 },
                { text: '西', px: -rx + 2, py: 0 },
                { text: '北', px: 0, py: -ry + 1 }
            ];

            compassDirs.forEach(dir => {
                ctx.save();
                ctx.translate(dir.px, dir.py);
                ctx.fillStyle = '#0d9488';
                ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 8.5px "Noto Sans TC", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(dir.text, 0, 0);
                ctx.restore();
            });

            ctx.restore();
        }

        function drawStudent(student, targetPos) {
            const pos = worldToScreen(student.x, student.y);
            const eyeY = pos.y - 45;
            const waistY = pos.y - 22;

            const targetP = worldToScreen(targetPos.x, targetPos.y);
            const dx = targetP.x - pos.x;
            const dy = targetP.y - eyeY;
            const isFacingLeft = dx < 0;

            const angleRad = Math.atan2(-dy, Math.abs(dx));

            drawWaistCompass(pos.x, waistY);

            ctx.save();
            ctx.translate(pos.x, pos.y);

            // Ground Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
            ctx.beginPath(); ctx.ellipse(0, 3, 16, 5, 0, 0, Math.PI * 2); ctx.fill();

            if (isFacingLeft) {
                ctx.scale(-1, 1);
            }

            if (student.isFemale) {
                // ==================== FEMALE STUDENT (GIRL) ====================
                ctx.strokeStyle = '#fbcfe8';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(-4, -10); ctx.lineTo(-4, 0);
                ctx.moveTo(4, -10); ctx.lineTo(4, 0);
                ctx.stroke();

                ctx.fillStyle = '#d946ef';
                ctx.beginPath();
                ctx.arc(-5, 1, 3.5, 0, Math.PI * 2);
                ctx.arc(5, 1, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#be185d';
                ctx.beginPath();
                ctx.moveTo(-11, -12);
                ctx.lineTo(11, -12);
                ctx.lineTo(14, -22);
                ctx.lineTo(-14, -22);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ec4899';
                ctx.beginPath(); ctx.roundRect(-9, -34, 18, 14, 4); ctx.fill();

                ctx.fillStyle = '#c084fc';
                ctx.beginPath(); ctx.roundRect(-14, -31, 5, 16, 2); ctx.fill();

                ctx.save();
                ctx.translate(0, -43);
                ctx.rotate(-angleRad * 0.65);

                ctx.fillStyle = '#fed7aa';
                ctx.beginPath(); ctx.arc(0, 0, 10.5, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#0f172a';
                ctx.beginPath(); ctx.arc(5, -1, 2.0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(6, -2, 0.8, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = '#be185d';
                ctx.lineWidth = 1.2;
                ctx.beginPath(); ctx.arc(4, 2, 2.8, 0.1, Math.PI * 0.8); ctx.stroke();

                ctx.fillStyle = '#451a03';
                ctx.beginPath(); ctx.arc(0, -2, 11.5, Math.PI * 0.8, Math.PI * 2.1); ctx.fill();
                
                ctx.beginPath(); ctx.ellipse(-9, 2, 7, 3.5, 0.6, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(-8, -6, 6, 3, -0.4, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#f43f5e';
                ctx.beginPath(); ctx.arc(-8, 0, 3, 0, Math.PI * 2); ctx.fill();

                ctx.restore();

            } else {
                // ==================== MALE STUDENT (BOY) ====================
                ctx.strokeStyle = state.isNight ? '#94a3b8' : '#1e293b';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(-5, -12); ctx.lineTo(-5, 0);
                ctx.moveTo(5, -12); ctx.lineTo(5, 0);
                ctx.stroke();

                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(-6, 1, 3.5, 0, Math.PI * 2);
                ctx.arc(6, 1, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = state.isNight ? '#2563eb' : '#0284c7';
                ctx.beginPath(); ctx.roundRect(-10, -34, 20, 22, 5); ctx.fill();

                ctx.fillStyle = '#f59e0b';
                ctx.beginPath(); ctx.roundRect(-15, -31, 6, 17, 2); ctx.fill();

                ctx.save();
                ctx.translate(0, -45);
                ctx.rotate(-angleRad * 0.65);

                ctx.fillStyle = '#fed7aa';
                ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#0f172a';
                ctx.beginPath(); ctx.arc(5, -1, 2.0, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = '#9a3412';
                ctx.lineWidth = 1.2;
                ctx.beginPath(); ctx.arc(4, 2, 3, 0.1, Math.PI * 0.8); ctx.stroke();

                ctx.fillStyle = '#facc15';
                ctx.beginPath(); ctx.arc(0, -3, 12, Math.PI, 0); ctx.fill();
                ctx.fillStyle = '#eab308';
                ctx.beginPath(); ctx.ellipse(5, -3, 11, 3.5, 0.1, 0, Math.PI * 2); ctx.fill();

                ctx.restore();
            }

            ctx.restore();
        }

        function drawTarget(targetP, groundP) {
            ctx.save();

            if (state.targetType === 'moon') {
                ctx.translate(targetP.x, targetP.y);
                
                const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 50);
                glow.addColorStop(0, 'rgba(254, 240, 138, 0.85)');
                glow.addColorStop(0.5, 'rgba(253, 224, 71, 0.25)');
                glow.addColorStop(1, 'transparent');
                ctx.fillStyle = glow;
                ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#fef08a';
                ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fef9c3';
                ctx.beginPath(); ctx.arc(-6, -5, 5, 0, Math.PI * 2); ctx.fill();

            } else if (state.targetType === 'lamp') {
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(targetP.x, groundP.y);
                ctx.lineTo(targetP.x, targetP.y);
                ctx.stroke();

                ctx.fillStyle = 'rgba(253, 224, 71, 0.2)';
                ctx.beginPath();
                ctx.moveTo(targetP.x, targetP.y);
                ctx.lineTo(targetP.x - 55, groundP.y);
                ctx.lineTo(targetP.x + 55, groundP.y);
                ctx.closePath();
                ctx.fill();

                ctx.translate(targetP.x, targetP.y);
                ctx.fillStyle = '#fef08a';
                ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();

            } else if (state.targetType === 'tree') {
                ctx.strokeStyle = '#854d0e';
                ctx.lineWidth = 12;
                ctx.beginPath();
                ctx.moveTo(targetP.x, groundP.y);
                ctx.quadraticCurveTo(targetP.x + 10, (groundP.y + targetP.y) / 2, targetP.x, targetP.y);
                ctx.stroke();

                ctx.translate(targetP.x, targetP.y);
                ctx.fillStyle = '#15803d';
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
                    ctx.save();
                    ctx.rotate(a);
                    ctx.beginPath(); ctx.ellipse(18, 0, 18, 6, 0.2, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }

            } else {
                ctx.translate(targetP.x, targetP.y);

                if (state.targetType === 'balloon') {
                    ctx.fillStyle = '#78350f'; ctx.fillRect(-6, 15, 12, 9);
                    const bGrad = ctx.createRadialGradient(-4, -6, 2, 0, 0, 20);
                    bGrad.addColorStop(0, '#ef4444');
                    bGrad.addColorStop(0.5, '#f59e0b');
                    bGrad.addColorStop(1, '#0284c7');
                    ctx.fillStyle = bGrad;
                    ctx.beginPath(); ctx.arc(0, -4, 18, 0, Math.PI * 2); ctx.fill();

                } else if (state.targetType === 'kite') {
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(15, 0); ctx.lineTo(0, 20); ctx.lineTo(-15, 0); ctx.closePath(); ctx.fill();

                } else if (state.targetType === 'drone') {
                    ctx.fillStyle = '#334155'; ctx.fillRect(-14, -4, 28, 8);
                    ctx.fillStyle = '#38bdf8'; ctx.fillRect(-20, -9, 10, 3); ctx.fillRect(10, -9, 10, 3);
                }
            }

            // Pivot Point Marker
            ctx.fillStyle = '#dc2626';
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        function drawSightlinesAndAngles() {
            const posA = worldToScreen(state.studentA.x, state.studentA.y);
            const eyeA = { x: posA.x, y: posA.y - 45 };
            const targetP = worldToScreen(state.target.x, state.target.y);

            const dxA = state.target.x - state.studentA.x;
            const eyeWorldY_A = state.studentA.y + (45 / state.pixelsPerMeter);
            const dyA = state.target.y - eyeWorldY_A;

            const projC = { x: targetP.x, y: eyeA.y };
            const groundC = worldToScreen(state.target.x, 0);
            const groundStudentA = worldToScreen(state.studentA.x, 0);

            // Horizontal Baseline A
            ctx.strokeStyle = state.isNight ? '#38bdf8' : '#0284c7';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(eyeA.x - 20, eyeA.y);
            ctx.lineTo(targetP.x + 20, eyeA.y);
            ctx.stroke();

            // Vertical Height Line h (Rose Red)
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(projC.x, projC.y);
            ctx.lineTo(targetP.x, targetP.y);
            ctx.stroke();

            // Right Angle Square Marker
            const rxSign = dxA >= 0 ? -10 : 10;
            const rySign = dyA >= 0 ? -10 : 10;
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(projC.x + rxSign, projC.y);
            ctx.lineTo(projC.x + rxSign, projC.y + rySign);
            ctx.lineTo(projC.x, projC.y + rySign);
            ctx.stroke();

            // Primary Sightline Student A (Amber/Orange)
            ctx.strokeStyle = state.isNight ? '#facc15' : '#ea580c';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 4]);
            ctx.beginPath();
            ctx.moveTo(eyeA.x, eyeA.y);
            ctx.lineTo(targetP.x, targetP.y);
            ctx.stroke();
            ctx.setLineDash([]);

            // Angle Arc at Student A
            const angleRadA = Math.atan2(dyA, Math.abs(dxA));
            const angleDegA = angleRadA * (180 / Math.PI);

            const arcR = 38;
            ctx.strokeStyle = '#f59e0b';
            ctx.fillStyle = 'rgba(251, 191, 36, 0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(eyeA.x, eyeA.y);
            if (dxA >= 0) {
                ctx.arc(eyeA.x, eyeA.y, arcR, 0, -angleRadA, true);
            } else {
                ctx.arc(eyeA.x, eyeA.y, arcR, Math.PI, Math.PI + angleRadA, false);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Angle Text Label
            ctx.fillStyle = state.isNight ? '#fde047' : '#b45309';
            ctx.font = 'bold 13px sans-serif';
            const labelXA = eyeA.x + (dxA >= 0 ? arcR + 8 : -arcR - 38);
            ctx.fillText(`${angleDegA.toFixed(1)}°`, labelXA, eyeA.y - 8);

            // Ground Distance Line Student A
            ctx.strokeStyle = state.isNight ? '#38bdf8' : '#0284c7';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(groundStudentA.x, groundStudentA.y + 12);
            ctx.lineTo(groundC.x, groundC.y + 12);
            ctx.stroke();

            ctx.fillStyle = state.isNight ? '#7dd3fc' : '#0369a1';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`x₁ = ${Math.abs(dxA).toFixed(1)}m`, (groundStudentA.x + groundC.x) / 2, groundStudentA.y + 28);

            // Secondary Student B (Female) in Dual Mode
            if (state.mode === 'dual') {
                const posB = worldToScreen(state.studentB.x, state.studentB.y);
                const eyeB = { x: posB.x, y: posB.y - 45 };
                const dxB = state.target.x - state.studentB.x;
                const eyeWorldY_B = state.studentB.y + (45 / state.pixelsPerMeter);
                const dyB = state.target.y - eyeWorldY_B;

                const groundStudentB = worldToScreen(state.studentB.x, 0);

                // Horizontal Baseline B
                ctx.strokeStyle = '#c084fc';
                ctx.lineWidth = 1.8;
                ctx.setLineDash([6, 4]);
                ctx.beginPath();
                ctx.moveTo(eyeB.x - 20, eyeB.y);
                ctx.lineTo(targetP.x + 20, eyeB.y);
                ctx.stroke();

                // Sightline Student B
                ctx.strokeStyle = '#d946ef';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([8, 4]);
                ctx.beginPath();
                ctx.moveTo(eyeB.x, eyeB.y);
                ctx.lineTo(targetP.x, targetP.y);
                ctx.stroke();
                ctx.setLineDash([]);

                // Angle Arc Student B
                const angleRadB = Math.atan2(dyB, Math.abs(dxB));
                const angleDegB = angleRadB * (180 / Math.PI);

                ctx.strokeStyle = '#e879f9';
                ctx.fillStyle = 'rgba(217, 70, 239, 0.22)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(eyeB.x, eyeB.y);
                if (dxB >= 0) {
                    ctx.arc(eyeB.x, eyeB.y, arcR, 0, -angleRadB, true);
                } else {
                    ctx.arc(eyeB.x, eyeB.y, arcR, Math.PI, Math.PI + angleRadB, false);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Angle Label Student B
                ctx.fillStyle = '#f472b6';
                ctx.font = 'bold 13px sans-serif';
                const labelXB = eyeB.x + (dxB >= 0 ? arcR + 8 : -arcR - 38);
                ctx.fillText(`${angleDegB.toFixed(1)}°`, labelXB, eyeB.y - 8);

                // Ground Distance Line Student B
                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(groundStudentB.x, groundStudentB.y + 36);
                ctx.lineTo(groundC.x, groundC.y + 36);
                ctx.stroke();

                ctx.fillStyle = '#c084fc';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`x₂ = ${Math.abs(dxB).toFixed(1)}m`, (groundStudentB.x + groundC.x) / 2, groundStudentB.y + 52);

                // Draw Female Student Character (B)
                drawStudent(state.studentB, state.target);
            }

            // Draw Male Student Character (A)
            drawStudent(state.studentA, state.target);

            // Draw Target Object
            drawTarget(targetP, groundC);

            // Update Compass Rose Needle Rotation
            updateCompassRose(dxA, dyA);
        }

        function updateCompassRose(dx, dy) {
            const pointer = document.getElementById('compass-pointer');
            const text = document.getElementById('compass-direction-text');

            let bearingText = '東 (East)';
            let rotationDeg = 90;

            if (dx >= 0 && dy === 0) {
                bearingText = '東 (East)'; rotationDeg = 90;
            } else if (dx > 0 && dy > 0) {
                bearingText = '東北 (Northeast)'; rotationDeg = 45;
            } else if (dx === 0 && dy > 0) {
                bearingText = '北 (North)'; rotationDeg = 0;
            } else if (dx < 0 && dy > 0) {
                bearingText = '西北 (Northwest)'; rotationDeg = 315;
            } else if (dx < 0 && dy === 0) {
                bearingText = '西 (West)'; rotationDeg = 270;
            } else if (dx < 0 && dy < 0) {
                bearingText = '西南 (Southwest)'; rotationDeg = 225;
            } else if (dx === 0 && dy < 0) {
                bearingText = '南 (South)'; rotationDeg = 180;
            } else if (dx > 0 && dy < 0) {
                bearingText = '東南 (Southeast)'; rotationDeg = 135;
            }

            if (pointer) pointer.style.transform = `rotate(${rotationDeg}deg)`;
            if (text) text.innerText = `相對方位: ${bearingText}`;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            drawSightlinesAndAngles();
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function onPointerDown(e) {
            const pos = getPointerPos(e);

            const posA = worldToScreen(state.studentA.x, state.studentA.y);
            const targetP = worldToScreen(state.target.x, state.target.y);

            const distStudentA = Math.hypot(pos.x - posA.x, pos.y - (posA.y - 25));
            const distTarget = Math.hypot(pos.x - targetP.x, pos.y - targetP.y);

            if (distTarget < 48) {
                state.activeDrag = 'target';
                if (e.cancelable) e.preventDefault();
            } else if (distStudentA < 48) {
                state.activeDrag = 'studentA';
                if (e.cancelable) e.preventDefault();
            } else if (state.mode === 'dual') {
                const posB = worldToScreen(state.studentB.x, state.studentB.y);
                const distStudentB = Math.hypot(pos.x - posB.x, pos.y - (posB.y - 25));
                if (distStudentB < 48) {
                    state.activeDrag = 'studentB';
                    if (e.cancelable) e.preventDefault();
                }
            }
        }

        function onPointerMove(e) {
            if (!state.activeDrag) return;

            const pos = getPointerPos(e);
            const worldPos = screenToWorld(pos.x, pos.y);

            if (state.activeDrag === 'target') {
                state.target.x = Math.max(0.5, Math.min(38.0, worldPos.x));
                state.target.y = Math.max(0.5, Math.min(18.0, worldPos.y));
            } else if (state.activeDrag === 'studentA') {
                // Main student locked horizontally on ground level (y: 0.0)
                state.studentA.x = Math.max(0.5, Math.min(38.0, worldPos.x));
                state.studentA.y = 0.0;
            } else if (state.activeDrag === 'studentB') {
                // Secondary student locked horizontally on ground level (y: 0.0)
                state.studentB.x = Math.max(0.5, Math.min(38.0, worldPos.x));
                state.studentB.y = 0.0;
            }

            render();
            if (e.cancelable) e.preventDefault();
        }

        function onPointerUp() {
            state.activeDrag = null;
        }

        // Attach Event Handlers
        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerUp);

        // Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') stepStudent(-0.5);
            if (e.key === 'ArrowRight' || e.key === 'd') stepStudent(0.5);
        });

        // Initialize Application
        window.onload = function() {
            resizeCanvas();
        };
    </script>
</body>
